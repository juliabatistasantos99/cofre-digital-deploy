name: Cofre Digital - Deploy Automatizado

on:
  push:
    branches: [ main, develop ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/cofre-digital-deploy

jobs:
  build:
    name: Build da Aplicação (Gerar Imagem)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Login no Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir e enviar imagem Docker
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    name: Deploy em Staging (Homologação)
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy Staging
      run: |
        echo "Iniciando deploy para STAGING..."
        echo "Simulando deploy com segredos de teste..."

  deploy-production:
    name: Deploy em Produção
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy Produção
      run: |
        echo "Iniciando deploy para PRODUÇÃO..."
        echo "Aplicação publicada com sucesso em ambiente seguro!"
